# deploy/nginx/melogen.conf
#
# To be included inside the existing `server { server_name strandz.it; ... }`
# block, next to jigdaw.conf, so the app is at https://strandz.it/melogen/.
#
# Note the trailing slash on proxy_pass. It strips the /melogen/ prefix, so the
# application serves at its own root and is identical in development and
# production. Removing that slash breaks every path silently.
#
# The application sends its own security headers (a Content-Security-Policy,
# nosniff, a referrer policy), so there is no add_header here: an add_header
# inside a location would replace the server block's headers rather than add to
# them, and anything set at both levels would be sent twice.

# Relative URLs only resolve correctly with the trailing slash.
location = /melogen {
    return 301 /melogen/;
}

location /melogen/ {
    proxy_pass http://127.0.0.1:47219/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
